# 粘进 zxLumen-Blog/docker/docker-compose.yml 的 services: 下。
# 同时在文件末尾 volumes: 加一行 duiwei-data:
  duiwei:
    mem_limit: 96m
    image: ghcr.io/zxlumen/jd-screener:${JD_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8790
      # 大模型经主站 AI 网关；令牌在 admin「AI 密钥」页生成后填 docker/.env 的 JD_AI_TOKEN
      ZX_AI_GATEWAY_URL: http://app:3000/api/ai/v1
      ZX_AI_APP_TOKEN: ${JD_AI_TOKEN:-}
      # 可选：留空由网关按令牌/密钥决定
      JD_MODEL: ${JD_MODEL:-}
      # 搜索/简历解析限额（不填用服务端默认）
      JD_SEARCH_RATE: ${JD_SEARCH_RATE:-30}
      JD_SEARCH_DAILY: ${JD_SEARCH_DAILY:-300}
      JD_RESUME_RATE: ${JD_RESUME_RATE:-20}
      # 来源登录令牌（BOSS/脉脉 cookie 管理）；不填则网页「来源登录」关闭
      JD_ADMIN_TOKEN: ${JD_ADMIN_TOKEN:-}
    volumes:
      - duiwei-data:/app/data
    expose:
      - "8790"
    networks:
      - web
